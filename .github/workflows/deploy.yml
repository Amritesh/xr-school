name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install report dependencies
        run: python -m pip install -r requirements-report.txt

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run strict verification
        run: npm run verify

      - name: Verify generated sources are current
        run: |
          git diff --exit-code -- \
            generated/openapi/openapi.json \
            apps/web/lib/scienceCatalog.generated.ts \
            apps/web/lib/curriculumSearch.generated.ts \
            reports/data/implemented-simulation-quality-cards.json \
            reports/data/implemented-simulation-quality-evidence.json \
            reports/data/new-simulation-before-after-scorecard.json \
            reports/data/simulation-quality-pdf-visual-qa.json \
            output/pdf/xr-school-implemented-simulations-quality-report.md \
            output/pdf/xr-school-implemented-simulations-quality-report.pdf \
            output/pdf/xr-school-new-simulations-top-10-mistakes.md \
            output/pdf/xr-school-new-simulations-top-10-mistakes.pdf \
            output/pdf/aditya-contribution-improvement-report.md \
            output/pdf/aditya-contribution-improvement-report.pdf

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
